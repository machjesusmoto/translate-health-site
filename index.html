const AgentGlyph = ({ name, size = 56 }) => {
  const stroke = "currentColor";
  const sw = 1.4;
  const common = { width: size, height: size, viewBox: "0 0 56 56", fill: "none", stroke, strokeWidth: sw, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {

      return <svg {...common}><circle cx="28" cy="28" r="6" /><circle cx="28" cy="28" r="13" opacity="0.55" /><circle cx="28" cy="28" r="20" opacity="0.25" /><circle cx="28" cy="28" r="2" fill={stroke} stroke="none" /></svg>;
    case "Translator":
      return <svg {...common}><path d="M8 16 Q8 11, 13 11 H22 Q27 11, 27 16 V22 Q27 27, 22 27 H17 L13 31 V27 Q8 27, 8 22 Z" /><rect x="32" y="14" width="16" height="3" rx="1" /><rect x="32" y="22" width="11" height="3" rx="1" /><rect x="32" y="30" width="14" height="3" rx="1" /></svg>;
    case "Analyst":
      return <svg {...common}><path d="M8 44 V12 M8 44 H48" /><circle cx="14" cy="36" r="1.6" fill={stroke} stroke="none" /><circle cx="20" cy="32" r="1.6" fill={stroke} stroke="none" /><circle cx="26" cy="26" r="1.6" fill={stroke} stroke="none" /><circle cx="32" cy="22" r="1.6" fill={stroke} stroke="none" /><circle cx="38" cy="18" r="1.6" fill={stroke} stroke="none" /><circle cx="44" cy="14" r="1.6" fill={stroke} stroke="none" /><path d="M11 38 L46 14" opacity="0.4" /></svg>;
    case "Storyteller":
      return <svg {...common}><rect x="10" y="10" width="26" height="34" rx="2" /><path d="M16 22 L20 18 L24 23 L28 16 L32 21" /><line x1="16" y1="32" x2="30" y2="32" /><line x1="16" y1="37" x2="26" y2="37" /><path d="M40 14 V46 H20" opacity="0.3" /></svg>;
    case "Advocate":
      return <svg {...common}><path d="M28 8 L44 14 V28 Q44 40, 28 48 Q12 40, 12 28 V14 Z" /><line x1="20" y1="22" x2="36" y2="22" /><line x1="20" y1="28" x2="32" y2="28" /><line x1="20" y1="34" x2="34" y2="34" /></svg>;
    case "Librarian":
      return <svg {...common}><path d="M28 8 L48 18 L28 28 L8 18 Z" /><path d="M8 28 L28 38 L48 28" /><path d="M8 38 L28 48 L48 38" opacity="0.55" /></svg>;
    case "Scout":
      return <svg {...common}><circle cx="28" cy="28" r="18" /><path d="M22 34 L28 18 L34 34 L28 30 Z" fill={stroke} fillOpacity="0.15" /><line x1="28" y1="6" x2="28" y2="10" /><line x1="28" y1="46" x2="28" y2="50" /><line x1="6" y1="28" x2="10" y2="28" /><line x1="46" y1="28" x2="50" y2="28" /></svg>;
    default:
      return <svg {...common}><circle cx="28" cy="28" r="14" /></svg>;
  }
};

const Sparkline = ({ values, width = 120, height = 32, color = "var(--sage-700)", strokeWidth = 1.4 }) => {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const stepX = width / (values.length - 1);
  const points = values.map((v, i) => [i * stepX, height - ((v - min) / range) * height * 0.85 - height * 0.075]);
  const d = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} aria-hidden="true">
      <path d={d} fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r="2" fill={color} />
    </svg>
  );
};
</script>

<script type="text/babel">
/* ---------- Problem ---------- */
const Problem = () => {
  const crises = [
    { n: "I", label: "Memory", head: "\"How long has this been going on?\"", body: "And you can't remember. The honest answer is months, but the numbers, the patterns, the start date — gone." },
    { n: "II", label: "Communication", head: "\"It hurts a lot.\"", body: "Doesn't convey severity, pattern, or impact. Fifteen-minute appointments rarely leave room to translate experience into clinical signal." },
    { n: "III", label: "Coordination", head: "\"Did you tell rheumatology about that?\"", body: "Multiple providers, scattered records, no one sees the whole picture. You become the unpaid integration layer for your own body." },
  ];
  return (
    <section className="section-tight" style={{ borderTop: "1px solid rgba(45,45,45,0.06)", borderBottom: "1px solid rgba(45,45,45,0.06)" }}>
      <div className="container">
        <div style={{ maxWidth: 720, marginBottom: 56 }}>
          <div className="eyebrow" style={{ marginBottom: 16, color: "var(--coral-500)" }}>The problem</div>
          <h2 className="display display-l" style={{ margin: 0 }}>
            Chronic illness has three<br /><em style={{ color: "var(--coral-500)", fontWeight: 360 }}>invisible crises.</em>
          </h2>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 0, borderTop: "1px solid rgba(45,45,45,0.10)" }}>

              <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
                <span className="serif" style={{ fontSize: 22, color: "var(--coral-500)", fontStyle: "italic" }}>{c.n}.</span>

};
</script>

<script type="text/babel">
