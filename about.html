<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="About — Translate Health. Built by a patient, for patients." />
<title>About — Translate Health</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Geist:wght@300;400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body data-warmth="warm" data-density="default">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
const TH_Logo = ({ size = 28, color = "currentColor" }) => (
  <span style={{ display: "inline-flex", alignItems: "center", gap: 10, color }}>
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M6 11 C 6 7, 10 5, 14 7 L 14 11" stroke={color} strokeWidth="1.6" fill="none" strokeLinecap="round" />
      <path d="M18 21 L 18 25 C 22 27, 26 25, 26 21" stroke={color} strokeWidth="1.6" fill="none" strokeLinecap="round" />
      <circle cx="10" cy="16" r="1.6" fill={color} />
      <circle cx="16" cy="16" r="1.6" fill={color} />
      <circle cx="22" cy="16" r="1.6" fill={color} />
    </svg>
    <span style={{ fontFamily: "var(--font-display)", fontSize: 19, fontWeight: 420, letterSpacing: "-0.01em", color }}>Translate Health</span>
  </span>
);

const Arrow = ({ size = 14 }) => (
  <svg width={size} height={size} viewBox="0 0 14 14" className="arrow" aria-hidden="true">
    <path d="M2 7 H11 M7.5 3.5 L11 7 L7.5 10.5" stroke="currentColor" strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />
  </svg>
);

const Nav = () => {
  const [mobileOpen, setMobileOpen] = React.useState(false);
  return (
    <header style={{
      position: "sticky", top: 0, zIndex: 50,
      background: "rgba(250,248,245,0.82)",
      backdropFilter: "saturate(180%) blur(12px)",
      WebkitBackdropFilter: "saturate(180%) blur(12px)",
      borderBottom: "1px solid rgba(45,45,45,0.06)",
    }}>
      <div className="container" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", height: 68 }}>
        <a href="/" style={{ textDecoration: "none" }}><TH_Logo color="var(--ink-900)" /></a>
        <nav style={{ display: "flex", gap: 32 }}>
          <a href="/#how" style={{ fontSize: 14, color: "var(--ink-700)", textDecoration: "none", fontWeight: 450, letterSpacing: "-0.005em" }}>How it works</a>
          <a href="/#agents" style={{ fontSize: 14, color: "var(--ink-700)", textDecoration: "none", fontWeight: 450, letterSpacing: "-0.005em" }}>Agents</a>
          <a href="/for-providers.html" style={{ fontSize: 14, color: "var(--ink-700)", textDecoration: "none", fontWeight: 450, letterSpacing: "-0.005em" }}>For providers</a>
          <a href="/about.html" style={{ fontSize: 14, color: "var(--ink-700)", textDecoration: "none", fontWeight: 450, letterSpacing: "-0.005em" }}>About</a>
        </nav>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <a href="#" style={{ fontSize: 14, color: "var(--ink-700)", textDecoration: "none", fontWeight: 450 }}>Sign in</a>
          <a href="/#waitlist" className="btn btn-primary" style={{ padding: "10px 18px", fontSize: 14 }}>Join waitlist <Arrow /></a>
          <button
            className="nav-mobile-toggle"
            onClick={() => setMobileOpen(o => !o)}
            aria-label="Toggle menu"
            style={{
              display: "none",
              background: "none",
              border: "none",
              cursor: "pointer",
              padding: 8,
              color: "var(--ink-700)",
            }}
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
        </div>
      </div>
      <div className={`nav-mobile-menu${mobileOpen ? " open" : ""}`}>
        <a href="/#how" onClick={() => setMobileOpen(false)}>How it works</a>
        <a href="/#agents" onClick={() => setMobileOpen(false)}>Agents</a>
        <a href="/for-providers.html" onClick={() => setMobileOpen(false)}>For providers</a>
        <a href="/about.html" onClick={() => setMobileOpen(false)}>About</a>
        <a href="/#waitlist" className="btn btn-primary" style={{ justifyContent: "center", marginTop: 4 }} onClick={() => setMobileOpen(false)}>Join waitlist <Arrow /></a>
      </div>
    </header>
  );
};

const Footer = () => {
  const cols = [
    { title: "Product", links: [
      { label: "How it works", href: "/#how" },
      { label: "Agents", href: "/#agents" },
      { label: "Dashboard", href: "/dashboard" },
      { label: "Features", href: "/features.html" },
      { label: "For providers", href: "/for-providers.html" },
      { label: "Pricing", href: "/pricing.html" },
    ]},
    { title: "Company", links: [
      { label: "About", href: "/about.html" },
      { label: "Blog", href: null },
      { label: "Founding 500", href: "/#waitlist" },
      { label: "Careers", href: null },
      { label: "Press", href: null },
    ]},
    { title: "Resources", links: [
      { label: "Support", href: "/support" },
      { label: "Get started", href: "/register" },
      { label: "Patient guide", href: null },
      { label: "Provider one-pager", href: null },
      { label: "Security", href: null },
      { label: "Status", href: null },
    ]},
    { title: "Legal", links: [
      { label: "Privacy", href: "/privacy" },
      { label: "Terms", href: "/terms" },
      { label: "Settings", href: "/settings" },
      { label: "HIPAA notice", href: "/hipaa.html" },
      { label: "Subprocessors", href: null },
    ]},
  ];
  return (
    <footer style={{ background: "var(--ink-900)", color: "var(--paper)", padding: "72px 0 40px" }}>
      <div className="container">
        <div style={{ display: "grid", gridTemplateColumns: "1.4fr repeat(4, 1fr)", gap: 48, marginBottom: 56 }}>
          <div>
            <TH_Logo color="var(--paper)" />
            <p style={{ marginTop: 18, fontSize: 14, color: "rgba(250,248,245,0.55)", maxWidth: 280, lineHeight: 1.55 }}>
              An AI health coordination platform for chronic illness. You talk. We translate. Doctors listen.
            </p>
          </div>
          {cols.map(c => (
            <div key={c.title}>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "rgba(250,248,245,0.45)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 14 }}>{c.title}</div>
              <ul style={{ listStyle: "none", margin: 0, padding: 0, display: "flex", flexDirection: "column", gap: 8 }}>
                {c.links.map(l => (
                  <li key={l.label}>
                    {l.href ? (
                      <a href={l.href} style={{ color: "rgba(250,248,245,0.85)", textDecoration: "none", fontSize: 14 }}>{l.label}</a>
                    ) : (
                      <span style={{ color: "rgba(250,248,245,0.35)", fontSize: 14, cursor: "default" }}>{l.label}</span>
                    )}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div style={{ paddingTop: 24, borderTop: "1px solid rgba(250,248,245,0.10)", display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, color: "rgba(250,248,245,0.45)", flexWrap: "wrap", gap: 12 }}>
          <span>© 2026 Translate Health · Built by patients, for patients</span>
          <span style={{ fontFamily: "var(--font-mono)" }}>v 0.1.0 · Founding 500</span>
        </div>
      </div>
    </footer>
  );
};

const App = () => (
  <React.Fragment>
    <Nav />
    <main>
      <section className="section" style={{ minHeight: "60vh" }}>
        <div className="container-narrow">
          <div className="eyebrow" style={{ marginBottom: 16 }}>About</div>
          <h1 className="display display-l" style={{ margin: "0 0 32px" }}>
            Built by a <em style={{ color: "var(--sage-700)", fontWeight: 360 }}>patient,</em><br />for patients.
          </h1>
          <div style={{ maxWidth: "64ch", margin: "0 auto" }}>
            <p className="lead" style={{ marginBottom: 20 }}>
              Translate Health was started by Dylan Taylor, a systems engineer who also happens to be a chronic illness patient. After years of forgetting symptom details in appointments, struggling to communicate severity, and acting as the unpaid integration layer between multiple specialists, he built the tool he wished existed.
            </p>
            <p style={{ fontSize: 16, color: "var(--ink-500)", lineHeight: 1.6, marginBottom: 20 }}>
              What began as a personal stack — daily SMS check-ins, correlation analysis, and auto-generated provider reports — grew into something bigger. Other patients wanted in. Doctors wanted the data. And it became clear that the problem wasn't a lack of health apps — it was a lack of tools designed for the reality of chronic illness.
            </p>
            <p style={{ fontSize: 16, color: "var(--ink-500)", lineHeight: 1.6, marginBottom: 20 }}>
              Existing tools demand consistency that chronic illness doesn't allow. They gamify suffering. They export to formats doctors can't read. They treat patients as data sources, not people with stories.
            </p>
            <div style={{ padding: "20px 24px", background: "var(--paper-deep)", borderRadius: 12, borderLeft: "3px solid var(--sage-500)", margin: "28px 0" }}>
              <p style={{ margin: 0, fontSize: 18, fontFamily: "var(--font-display)", fontWeight: 380, color: "var(--ink-900)", lineHeight: 1.4 }}>
                "You talk. We translate. Doctors listen."
              </p>
            </div>
            <p style={{ fontSize: 16, color: "var(--ink-500)", lineHeight: 1.6, marginBottom: 20 }}>
              Today, Translate Health is a team of seven AI agents working together to turn the chaos of a chronic day into structured, actionable health intelligence. We're onboarding our first cohort of 500 founding members in 2026.
            </p>
            <p style={{ fontSize: 16, color: "var(--ink-500)", lineHeight: 1.6 }}>
              If you're living with chronic illness, you already know the problem. We're building the solution.
            </p>
          </div>
          <div style={{ marginTop: 40, textAlign: "center" }}>
            <a href="/" className="btn btn-primary">Back to home <Arrow /></a>
          </div>
        </div>
      </section>
    </main>
    <Footer />
  </React.Fragment>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
